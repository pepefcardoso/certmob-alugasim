name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alugasim?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alugasim?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alugasim?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alugasim?schema=public
      BETTER_AUTH_SECRET: ci-build-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_FROM: 'Alugasim <no-reply@alugasim.com.br>'
      LEAD_NOTIFY_EMAIL: founder@alugasim.com.br
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: ci-build-placeholder
      DPO_EMAIL: privacidade@alugasim.com.br
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write .env for the compose stack
        run: |
          cat <<'EOF' > .env
          BETTER_AUTH_SECRET="ci-e2e-secret-please-rotate"
          BETTER_AUTH_URL="http://localhost:3000"
          RESEND_API_KEY=""
          EMAIL_FROM="Alugasim <no-reply@alugasim.com.br>"
          LEAD_NOTIFY_EMAIL="founder@alugasim.com.br"
          NEXT_PUBLIC_CALCOM_LINK="alugasim/demo"
          NEXT_PUBLIC_WHATSAPP_BUSINESS_NUMBER="47999998888"
          NEXT_PUBLIC_BETTER_AUTH_URL="http://localhost:3000"
          CRON_SECRET="ci-e2e-cron-secret"
          DPO_EMAIL="privacidade@alugasim.com.br"
          EOF

      - name: Start the compose stack
        run: docker compose up -d --wait app

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alugasim?schema=public

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 3
          done
          echo "App did not become ready in time" >&2
          docker compose logs app
          exit 1

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
