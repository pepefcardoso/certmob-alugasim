services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alugasim
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d alugasim']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alugasim?schema=public
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.generate-payments.schedule: '@daily'
      ofelia.job-exec.generate-payments.command: 'sh -c "curl -sf -X POST -H \"Authorization: Bearer $${CRON_SECRET}\" http://localhost:3000/api/jobs/generate-payments"'
      ofelia.job-exec.send-reminders.schedule: '@daily'
      ofelia.job-exec.send-reminders.command: 'sh -c "curl -sf -X POST -H \"Authorization: Bearer $${CRON_SECRET}\" http://localhost:3000/api/jobs/send-reminders"'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      - app
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  node_modules:
