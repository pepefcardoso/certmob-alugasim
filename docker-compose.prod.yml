services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik-public
      - db-internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.renteasy.rule=Host(`renteasy.pepefcardoso.dev`)'
      - 'traefik.http.routers.renteasy.entrypoints=websecure'
      - 'traefik.http.routers.renteasy.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.renteasy.middlewares=renteasy-security-headers@file'
      - 'traefik.http.services.renteasy.loadbalancer.server.port=3000'
      - 'ofelia.enabled=true'
      - 'ofelia.job-exec.generate-payments.schedule=@daily'
      - 'ofelia.job-exec.generate-payments.command=sh -c "curl -sf -X POST -H \"Authorization: Bearer $${CRON_SECRET}\" http://localhost:3000/api/jobs/generate-payments"'
      - 'ofelia.job-exec.send-reminders.schedule=@daily'
      - 'ofelia.job-exec.send-reminders.command=sh -c "curl -sf -X POST -H \"Authorization: Bearer $${CRON_SECRET}\" http://localhost:3000/api/jobs/send-reminders"'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - db-internal
    volumes:
      - renteasy_postgres_data:/var/lib/postgresql/data

  scheduler:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      - app
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  traefik-public:
    external: true
  db-internal:
    external: false

volumes:
  renteasy_postgres_data:
